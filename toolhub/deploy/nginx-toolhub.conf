# ToolHub behind Cloudflare on Ubuntu 22.04.
# Install to /etc/nginx/sites-available/toolhub and symlink into sites-enabled.
# Replace example.com with your domain before reloading nginx.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Restores the visitor address from Cloudflare instead of seeing the edge IP.
    # The ranges are refreshed by deploy/cloudflare-ips.sh.
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Room above PRODUCT_FILE_MAX_MB, otherwise nginx cuts installer uploads off.
    client_max_body_size 600m;
    client_body_timeout 600s;

    # Cloudflare will not cache these anyway, and the panel must never be cached.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # Large uploads and downloads stream through untouched.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 120s;
    }
}
