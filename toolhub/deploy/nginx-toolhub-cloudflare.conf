# ToolHub behind Cloudflare with a Cloudflare Origin Certificate.
# Use this instead of nginx-toolhub.conf when the domain is already proxied by
# Cloudflare (orange cloud): no certbot, no renewals, and the proxy never has
# to be switched off.
#
# Before reloading nginx:
#   1. replace example.com with your domain
#   2. save the origin certificate and key (see the README)
#   3. run deploy/cloudflare-ips.sh so /etc/nginx/cloudflare-ips.conf exists
#   4. set SSL/TLS mode to Full (strict) in the Cloudflare dashboard

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Cloudflare already serves the visitor over HTTPS; this only catches
    # requests that reach the origin on port 80.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # Cloudflare Origin Certificate. Trusted by Cloudflare only, which is all
    # that is needed: visitors see Cloudflare's own certificate.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Restores the visitor address instead of seeing the edge IP.
    # Generated and refreshed by deploy/cloudflare-ips.sh.
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Room above PRODUCT_FILE_MAX_MB, otherwise nginx cuts installer uploads off.
    client_max_body_size 600m;
    client_body_timeout 600s;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;

        # Large uploads and downloads stream through untouched.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 120s;
    }
}
